# SPDX-License-Identifier: Apache-2.0
name: Release

on:
  push:
    branches:
      - main

# Never cancel a run that may already be pushing an image.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Create the release
    runs-on: ubuntu-latest
    # semantic-release needs to push its version commit and tag, then create the GitHub release.
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released || 'false' }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Credentials MUST persist here: the baseline step below pushes a tag and
      # semantic-release pushes the version commit through this same git remote.
      - name: Check out main with full history  # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN || github.token }}

      # The branch may advance while a queued release waits. Release exactly
      # the push that started this run; the workflow concurrency lock ensures
      # the next push is evaluated separately.
      - name: Reset the release branch to the triggering commit
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: git reset --hard "$RELEASE_SHA"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # release-please never created a tag in this repository. Establish the
      # version declared immediately before this push as the baseline; otherwise
      # semantic-release starts at 0.0.0 and would downgrade the existing 0.1.0.
      - name: Establish the existing version baseline
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if git tag --list 'v[0-9]*' | grep -q .; then
            exit 0
          fi
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::cannot establish a release baseline without the previous main commit"
            exit 1
          fi
          version="$(git show "${BEFORE_SHA}:pyproject.toml" |
            python -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["project"]["version"])')"
          git tag "v${version}" "$BEFORE_SHA"
          git push origin "v${version}"

      # A repository whose branch rules reject GITHUB_TOKEN pushes can provide a
      # fine-grained PAT as SEMANTIC_RELEASE_TOKEN. Checkout and semantic-release
      # must use the same token so the version commit, tag, and release agree.
      - name: Release from conventional commits
        id: release
        uses: python-semantic-release/python-semantic-release@39dd2052f2ce8282a5d932c31d58a2ca06d2550e  # v10.6.1
        with:
          github_token: ${{ secrets.SEMANTIC_RELEASE_TOKEN || github.token }}
          # build_command only refreshes uv.lock; distributions build off the tag.
          build: true
          changelog: true

  docker:
    name: Build and push the image
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    # The release job reads the tag while the Docker client pushes the versioned image to GHCR.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      # Attestations need the docker-container driver; the default driver
      # silently drops them.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The event here is a push to main, not a tag push, so every semver
      # pattern has to be fed the tag semantic-release just cut.
      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.tag }}
          # auto, not true: a prerelease must never take over the latest tag.
          flavor: |
            latest=auto

      # Built locally first so the version check below runs before anything is
      # published. Attestations are deliberately absent here — they only exist
      # on a registry push, and this image is thrown away.
      - name: Build for verification
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: nso-adapter:verify

      # Guards the version chain: semantic-release has to have bumped
      # nso_adapter/__init__.py to exactly the tag it cut, and that is the value
      # the running service reports on /health.
      - name: Verify the image reports the released version
        env:
          TAG_NAME: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          expected="${TAG_NAME#v}"
          reported="$(docker run --rm --entrypoint /app/.venv/bin/python nso-adapter:verify \
            -c 'import nso_adapter; print(nso_adapter.__version__)')"
          if [ "$reported" != "$expected" ]; then
            echo "::error::image reports version '$reported' but tag $TAG_NAME expects '$expected'"
            exit 1
          fi
          echo "image reports $reported"

      # Cache-hits every layer from the verification build, so this only adds
      # the push, the attestations and the release tags.
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true

      - name: Summarise what was pushed
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Image pushed"
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo "$TAGS" | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build sdist and wheel
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - name: Build the distributions
        run: uv build

      # Guards the whole version chain: semantic-release has to have bumped both
      # pyproject.toml and nso_adapter/__init__.py to exactly the tag it cut.
      # Versions are compared as PEP 440 objects, not strings, because a tag
      # like v1.2.3-rc.1 legitimately normalises to 1.2.3rc1 in a filename.
      - name: Verify the built version matches the release tag
        env:
          TAG_NAME: ${{ needs.release.outputs.tag }}
        run: |
          cat > "${RUNNER_TEMP}/verify_version.py" <<'PY'
          import os, sys, zipfile
          from pathlib import Path
          from packaging.utils import parse_sdist_filename, parse_wheel_filename
          from packaging.version import Version

          tag = os.environ["TAG_NAME"]
          expected = Version(tag.removeprefix("v"))
          wheels = sorted(Path("dist").glob("*.whl"))
          sdists = sorted(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              sys.exit(f"::error::expected one wheel and one sdist, got {[p.name for p in wheels + sdists]}")

          found = {
              wheels[0].name: parse_wheel_filename(wheels[0].name)[1],
              sdists[0].name: parse_sdist_filename(sdists[0].name)[1],
          }
          with zipfile.ZipFile(wheels[0]) as whl:
              source = whl.read("nso_adapter/__init__.py").decode()
          declared = [ln for ln in source.splitlines() if ln.startswith("__version__")]
          if len(declared) != 1:
              sys.exit(f"::error::expected one __version__ line in the packaged __init__.py, got {len(declared)}")
          found["__version__"] = Version(declared[0].split("=", 1)[1].strip().strip("\"'"))

          for where, version in found.items():
              if version != expected:
                  sys.exit(f"::error::{where} declares {version}, but tag {tag} expects {expected}")
              print(f"{where}: {version}")
          PY
          uv run --no-project --with packaging -- python "${RUNNER_TEMP}/verify_version.py"

      # Hidden files are excluded by default, which keeps uv's dist/.gitignore
      # out of the artifact and therefore out of what is uploaded to PyPI.
      - name: Upload the distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [release, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nso-adapter
    # Trusted Publishing: PyPI verifies this short-lived OIDC token against the
    # publisher registered for repo + workflow file + environment. No API token.
    # id-token: write is the only permission needed to request that OIDC token.
    permissions:
      id-token: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
