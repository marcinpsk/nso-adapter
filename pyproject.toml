# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nso-adapter"
version = "0.4.0"
description = "Middleware adapter between Cisco NSO and NetBox"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "httpx>=0.28",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "alembic>=1.18.5",
    "apscheduler>=3.11.3",
    "hvac>=2.3",
    "pydantic-settings>=2.7",
    "structlog>=26.1.0",
    "python-dotenv>=1.1",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-httpx>=0.35",
    "pytest-xdist>=3.8",
    "respx>=0.21",
    "ruff>=0.16.1",
    "watchfiles>=1.0",
    # Keep in step with the pinned zizmor hook rev in .pre-commit-config.yaml.
    "zizmor==1.29.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nso_adapter*"]

[tool.semantic_release]
allow_zero_version = true
commit_message = "chore(release): {version} [skip ci]"
commit_parser = "conventional"
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["nso_adapter/__init__.py:__version__"]
# The PSR action container has no uv, so bootstrap it before locking. Scoped to THIS
# package on purpose: a bare `uv lock` re-resolves the whole graph, which would fold
# unrelated dependency upgrades into a release commit nobody reviewed.
build_command = """
set -e
command -v uv >/dev/null || python -m pip install 'uv ~= 0.12.3'
uv lock --upgrade-package nso-adapter
"""
# PSR adds these to the release commit, so the tag ships a lock matching its version.
assets = ["uv.lock"]
# PSR strips the build env to an allowlist; forward only vars that are safe when
# empty (PSR passes unset entries as "", which uv rejects for boolish UV_* vars).
build_command_env = ["http_proxy", "https_proxy", "no_proxy"]

[tool.semantic_release.branches.main]
match = "^main$"
prerelease = false

[tool.semantic_release.changelog]
mode = "update"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore", "revert"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "revert"]
parse_squash_commits = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=nso_adapter --cov-report=term-missing -n auto"

[tool.coverage.run]
source = ["nso_adapter"]
# Policy (docs/testing-strategy.md §5.1): file-level omits are restricted to
# auto-generated/test code — never source modules. Extract pure logic into
# testable helpers; let a thin lifecycle wrapper carry low coverage as a
# signal, not hide it behind an omit.
branch = true
# SQLAlchemy's async session bridges async<->sync via greenlet, so every async
# route handler that awaits the DB runs its body inside a greenlet-switched
# context. Without this, coverage cannot follow the switch and silently reports
# those (well-tested) handler bodies as uncovered. greenlet ships as a
# sqlalchemy[asyncio] dependency.
concurrency = ["greenlet"]
omit = ["*/alembic/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "D", "C901", "I", "RET", "UP", "DTZ"]
ignore = [
    "E501",
    "F403",
    "F405",
    # Docstring PRESENCE is not required — we enforce one FORMAT convention, not coverage.
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    # One convention: summary on the first line (D212), no blank line before a class
    # docstring (D211) — i.e. disable the conflicting D213/D203.
    "D203",
    "D213",
    "UP042",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["D"]
"alembic/**" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["nso_adapter"]
