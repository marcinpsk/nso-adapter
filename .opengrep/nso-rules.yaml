rules:
  - id: nso-outcome-raw-exception-renderer
    languages: [python]
    severity: ERROR
    message: Classify the outcome failure with failure_detail instead of rendering the exception.
    paths:
      include:
        - nso_adapter/main.py
        - nso_adapter/core/generation.py
        - nso_adapter/core/importer.py
        - nso_adapter/core/refresh_engine.py
        - nso_adapter/core/redistribution.py
        - nso_adapter/notifications/sse_subscriber.py
        - nso_adapter/notifications/persistent_subscriber.py
        - review-patterns.py
    pattern-either:
      - patterns:
          - pattern: logger.$LEVEL(..., error=$ERROR, ...)
          - pattern-not: logger.$LEVEL(..., error=failure_detail($EXCEPTION), ...)
      - patterns:
          - pattern-either:
              - pattern: logger.$LEVEL(..., detail=$EXCEPTION, ...)
              - pattern: logger.$LEVEL(..., detail=str($EXCEPTION), ...)
              - pattern: logger.$LEVEL(..., detail=repr($EXCEPTION), ...)
              - pattern: logger.$LEVEL(..., detail=f"...{$EXCEPTION}...", ...)
              - pattern: logger.$LEVEL(..., detail=$FORMAT.format(..., $EXCEPTION, ...), ...)
              - pattern: logger.$LEVEL(..., detail=$FORMAT % $EXCEPTION, ...)
              - pattern: logger.$LEVEL(..., detail=$LEFT + $EXCEPTION, ...)
              - pattern: logger.$LEVEL(..., detail=$EXCEPTION + $RIGHT, ...)
              - pattern: logger.$LEVEL(..., detail=$LEFT + str($EXCEPTION), ...)
              - pattern: logger.$LEVEL(..., detail=str($EXCEPTION) + $RIGHT, ...)
              - pattern: logger.$LEVEL(..., detail=$LEFT + repr($EXCEPTION), ...)
              - pattern: logger.$LEVEL(..., detail=repr($EXCEPTION) + $RIGHT, ...)
              - pattern: logger.$LEVEL(..., detail=format($EXCEPTION), ...)
          - metavariable-regex:
              metavariable: $EXCEPTION
              regex: ^(exc|exception|error)$
      - pattern: logger.$LEVEL(..., exc_info=True, ...)
      - pattern: logger.exception(...)
  - id: nso-outcome-raw-exception-alias-renderer
    languages: [python]
    severity: ERROR
    message: Classify an aliased outcome failure with failure_detail instead of rendering it.
    mode: taint
    paths:
      include:
        - nso_adapter/main.py
        - nso_adapter/core/generation.py
        - nso_adapter/core/importer.py
        - nso_adapter/core/refresh_engine.py
        - nso_adapter/core/redistribution.py
        - nso_adapter/notifications/sse_subscriber.py
        - nso_adapter/notifications/persistent_subscriber.py
        - review-patterns.py
    pattern-sources:
      - patterns:
          - pattern-inside: |
              try:
                ...
              except $TYPE as $EXCEPTION:
                ...
          - pattern: $EXCEPTION
    pattern-sanitizers:
      - pattern: failure_detail(...)
      - pattern: type(...).__name__
      - pattern: http_status_of(...)
    pattern-sinks:
      - patterns:
          - pattern: logger.$LEVEL(..., $FIELD=$DETAIL, ...)
          - focus-metavariable: $DETAIL
  - id: nso-api-validation-error-raw-exception-renderer
    languages: [python]
    severity: ERROR
    message: Use an authored validation message instead of rendering request or exception data.
    paths:
      include:
        - nso_adapter/api/devices.py
        - nso_adapter/api/lag_config.py
        - nso_adapter/api/vlan.py
        - review-patterns.py
    pattern-either:
      - pattern: api_error(..., "validation_error", str($EXCEPTION), ...)
      - pattern: api_error(..., "validation_error", repr($EXCEPTION), ...)
      - pattern: api_error(..., "validation_error", f"...{$VALUE}...", ...)
      - pattern: api_error(..., "validation_error", $FORMAT % $VALUE, ...)
      - pattern: api_error(..., "validation_error", $FORMAT.format(...), ...)
      - pattern: api_error(..., "validation_error", format($VALUE), ...)
      - pattern: api_error(..., "validation_error", $LEFT + $RIGHT, ...)
  - id: nso-api-validation-error-raw-data-alias
    languages: [python]
    severity: ERROR
    message: Use an authored validation message instead of request or exception data.
    mode: taint
    paths:
      include:
        - nso_adapter/api/devices.py
        - nso_adapter/api/lag_config.py
        - nso_adapter/api/vlan.py
        - review-patterns.py
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  def $FUNCTION(..., $REQUEST, ...):
                    ...
              - pattern-inside: |
                  async def $FUNCTION(..., $REQUEST, ...):
                    ...
          - metavariable-regex:
              metavariable: $REQUEST
              regex: ^(body|payload)$
          - pattern: $REQUEST.$FIELD
      - patterns:
          - pattern-inside: |
              try:
                ...
              except $TYPE as $EXCEPTION:
                ...
          - pattern: $EXCEPTION
    pattern-sanitizers:
      - patterns:
          - pattern-inside: |
              try:
                ...
              except $TYPE as $EXCEPTION:
                ...
          - pattern: $EXCEPTION.public_message
    pattern-sinks:
      - patterns:
          - pattern: api_error(..., "validation_error", $MESSAGE, ...)
          - focus-metavariable: $MESSAGE
  - id: nso-api-unknown-request-renderer
    languages: [python]
    severity: ERROR
    message: Use an authored unknown-value response instead of rendering request data.
    mode: taint
    paths:
      include:
        - nso_adapter/api/actions.py
        - review-patterns.py
    pattern-sources:
      - patterns:
          - pattern-inside: |
              async def action_force_removal(...):
                ...
          - pattern: body.scope
    pattern-sinks:
      - patterns:
          - pattern: api_error(...)
  - id: nso-api-conflict-handler-contract
    languages: [python]
    severity: ERROR
    message: Use one approved authored LookupError conflict handler and its stable reason.
    paths:
      include:
        - nso_adapter/api/devices.py
        - review-patterns.py
    patterns:
      - pattern-either:
          - pattern: |
              try:
                ...
              except LookupError as $EXCEPTION:
                $HANDLER
          - pattern: |
              try:
                ...
              except LookupError:
                $HANDLER
      - pattern-not: |
          try:
            ...
          except LookupError:
            refused = api_error(
                409,
                "conflict",
                _NETBOX_DEVICE_CLAIMED_MESSAGE,
                {"reason": "netbox_device_claimed"},
            )
      - pattern-not: |
          try:
            ...
          except LookupError:
            refused = api_error(
                409,
                "conflict",
                _DEVICE_IDENTITY_CLAIMED_MESSAGE,
                {"reason": "identity_claimed"},
            )
      - pattern-not: |
          try:
            ...
          except LookupError as $EXCEPTION:
            refused = api_error(
                409,
                "conflict",
                _NETBOX_DEVICE_CLAIMED_MESSAGE,
                {"reason": "netbox_device_claimed"},
            )
      - pattern-not: |
          try:
            ...
          except LookupError as $EXCEPTION:
            refused = api_error(
                409,
                "conflict",
                _DEVICE_IDENTITY_CLAIMED_MESSAGE,
                {"reason": "identity_claimed"},
            )
  - id: nso-failure-detail-raw-exception-renderer
    languages: [python]
    severity: ERROR
    message: Return a closed classification instead of rendering exception text.
    paths:
      include:
        - nso_adapter/nso/client.py
        - review-patterns.py
    patterns:
      - pattern-inside: |
          def $FUNCTION($EXCEPTION):
            ...
      - pattern-either:
          - pattern: return str($EXCEPTION)
          - pattern: return repr($EXCEPTION)
          - pattern: return f"...{$EXCEPTION}..."
          - pattern: return $FORMAT % $EXCEPTION
          - pattern: return $FORMAT.format($EXCEPTION)
          - pattern: return format($EXCEPTION)
          - pattern: return str($EXCEPTION.$ATTRIBUTE)
          - pattern: return repr($EXCEPTION.$ATTRIBUTE)
  - id: nso-diagnostic-raw-identifier
    languages: [python]
    severity: ERROR
    message: Log a stable internal identifier instead of a caller-provided device name or stream URL.
    paths:
      include:
        - nso_adapter/main.py
        - nso_adapter/core/refresh_engine.py
        - nso_adapter/notifications/sse_subscriber.py
        - nso_adapter/notifications/persistent_subscriber.py
        - review-patterns.py
    pattern-either:
      - pattern: logger.$LEVEL(..., device_name=$DEVICE.nso_device_name, ...)
      - pattern: logger.$LEVEL(..., stream=stream_url, ...)
      - pattern: logger.$LEVEL(..., stream_url=stream_url, ...)
      - pattern: logger.$LEVEL(..., url=stream_url, ...)
