version = 1

# Files that cannot carry a comment header, or that a tool writes: JSON, plain
# Markdown, the Alembic template, and uv.lock/CHANGELOG.md (semantic-release rewrites both).
[[annotations]]
path = [
    ".github/copilot-instructions.md",
    "CHANGELOG.md",
    "README.md",
    "alembic/README",
    "alembic/script.py.mako",
    "docs/**",
    "tests/**/*.json",
    "uv.lock",
]
SPDX-FileCopyrightText = "2026 Marcin Zieba <marcinpsk@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"
