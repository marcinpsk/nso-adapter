services:
  nso-adapter:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CONFIG_FILE=/app/config.yaml
      # NO_PROXY / no_proxy (NSO + Vault hosts) are injected from .env (gitignored)
      # via env_file above. Kept out of this tracked file and out of the
      # environment: block so the shell environment can't shadow them.
    # REQUIRED, not cosmetic: the worker fail-stops the whole process (os._exit) if a
    # cancellation drain or a terminal-write cleanup exceeds its bound, because continuing
    # would risk device writes under an ownership the adapter can no longer prove it holds.
    # Without a restart policy that exit leaves the adapter permanently down.
    restart: unless-stopped
    # Must exceed worker._SHUTDOWN_TASK_WAIT (100s): Docker's default 10s SIGKILL would
    # cut off the cancellation drain and claim release mid-write. A test pins this.
    stop_grace_period: 130s
    networks:
      - docker_frontend

networks:
  docker_frontend:
    external: true
