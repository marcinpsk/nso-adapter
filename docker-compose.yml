services:
  nso-adapter:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CONFIG_FILE=/app/config.yaml
      # NO_PROXY / no_proxy (NSO + Vault hosts) are injected from .env (gitignored)
      # via env_file above. Kept out of this tracked file and out of the
      # environment: block so the shell environment can't shadow them.
    networks:
      - docker_frontend

networks:
  docker_frontend:
    external: true
