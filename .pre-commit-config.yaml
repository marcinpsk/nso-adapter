---
repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: mixed-line-ending
        args: [--fix=lf]

  # Python code quality — ruff lint (incl. C901 complexity + one docstring format) + format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # GitHub Actions security audit. Offline by default, so it never blocks a commit on
  # network reachability. Keep in step with the pinned zizmor in [dependency-groups].dev,
  # which is what the CI job runs over the same tree.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor

  # In-house test-quality guard: flag new spec-less MagicMock/Mock used as object
  # stand-ins (see tests/mock_discipline.py). Stdlib-only; scans the whole tests/ tree.
  - repo: local
    hooks:
      - id: mock-discipline
        name: mock-discipline (no new spec-less MagicMock/Mock)
        entry: python3 -m tests.mock_discipline
        language: system
        pass_filenames: false
        files: ^tests/.*\.py$
      # Companion to ruff's DTZ rules: DTZ polices naive *construction*; this bans the
      # zone *strip* (.replace(tzinfo=None)) everywhere but the iso_z wire serializer.
      - id: tz-discipline
        name: tz-discipline (no .replace(tzinfo=None) outside iso_z)
        entry: python3 -m tests.tz_discipline
        language: system
        pass_filenames: false
        files: ^(nso_adapter|tests|scripts|alembic)/.*\.py$

  # Conventional commit message validation
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]

# Configuration
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
fail_fast: false
